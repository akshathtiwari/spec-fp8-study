[project]
name = "specfp8"
version = "0.1.0"
description = "Speculative Decoding × FP8 Compatibility Study — measurement harness"
requires-python = ">=3.10"
dependencies = [
    # Pinned rather than ranged. These affect orchestration and analysis,
    # not the measurements (the harness speaks HTTP and never imports the
    # engine) -- but "the analysis is reproducible" is a claim about them.
    # See docs/reproducibility.md for what is still unpinned.
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "pandas==3.0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
analysis = ["matplotlib>=3.8", "seaborn>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
