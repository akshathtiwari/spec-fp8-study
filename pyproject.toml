[project]
name = "specfp8"
version = "0.1.0"
description = "Speculative Decoding × FP8 Compatibility Study — measurement harness"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
analysis = ["matplotlib>=3.8", "seaborn>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
